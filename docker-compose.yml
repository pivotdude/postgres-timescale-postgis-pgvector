services:
  postgres_db:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VARIANT: ${VARIANT}
        INSTALL_POSTGIS: ${INSTALL_POSTGIS}
        INSTALL_TIMESCALE: ${INSTALL_TIMESCALE}
        INSTALL_PGVECTOR: ${INSTALL_PGVECTOR}
        INSTALL_TIMESCALEDB_TOOLS: ${INSTALL_TIMESCALEDB_TOOLS}
        POSTGRES_MAJOR: ${POSTGRES_MAJOR}
        POSTGRES_VERSION: ${POSTGRES_VERSION}
        POSTGRES_IMAGE_TAG: ${POSTGRES_IMAGE_TAG}
        POSTGIS_VERSION: ${POSTGIS_VERSION}
        PGVECTOR_VERSION: ${PGVECTOR_VERSION}
        TIMESCALEDB_VERSION: ${TIMESCALEDB_VERSION}
        POSTGIS_APT_VERSION: ${POSTGIS_APT_VERSION}
        PGVECTOR_APT_VERSION: ${PGVECTOR_APT_VERSION}
        TIMESCALEDB_APT_VERSION: ${TIMESCALEDB_APT_VERSION}
        TIMESCALEDB_TOOLS_APT_VERSION: ${TIMESCALEDB_TOOLS_APT_VERSION}
    container_name: postgres_db
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./dumps:/dumps
      - ./scripts:/scripts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: docker.io/dpage/pgadmin4:latest
    container_name: pgadmin_web
    restart: always
    ports:
      - "10001:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./servers.json:/pgadmin4/servers.json
    depends_on:
      - postgres_db

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
