name: Update pinned versions

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

jobs:
  update-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for newer package versions
        run: |
          chmod +x scripts/check-versions.sh
          scripts/check-versions.sh --write

      - name: Detect version file changes
        id: check
        run: |
          if git diff --quiet -- versions/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push version bumps
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions/
          git commit -m "chore: bump pinned package versions"
          git push
